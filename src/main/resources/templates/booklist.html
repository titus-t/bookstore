<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
 xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"> 


<head>
    <title>Bookstore</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<link type="text/css" rel="stylesheet" href= "/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" /></head>
<body>

    <div style="display: flex; justify-content: space-between; align-items: center; margin:15px;">
        
        <h1 style="margin: 0;">Books</h1>

        <div style="display: flex; align-items: center; gap: 15px;">
            <span>Welcome: <strong sec:authentication="name">User</strong></span>
            
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <input type="submit" value="Sign Out" class="btn btn-sm btn-outline-danger"/>
            </form>
        </div>

    </div>



<table class="table table-striped">
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Publication year</th>
        <th>ISBN</th>
		<th>Category</th>
		<th sec:authorize="hasAuthority('ADMIN')"> </th>
		<th></th>
		
    </tr>

    <tr th:each="book : ${books}">
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.publicationYear}"></td>
        <td th:text="${book.isbn}"></td>
		<td th:text="${book.category?.name}"></td> 

		<td sec:authorize="hasAuthority('ADMIN')"><a th:href="@{/delete/{id}(id=${book.id})}" class="btn btn-danger">Delete</a>
			<a th:href="@{/edit/{id}(id=${book.id})}" class="btn btn-primary" >Edit</a> 
		</td> 
		
    </tr>
</table>

<a href="/add" class="btn btn-success">Add Book</a> 

</body>
</html>
